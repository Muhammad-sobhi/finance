<!doctype html>
<html lang="ar" dir="rtl" data-theme="ledger">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe3" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>خزينتي — Treasury</title>
    <script>
      // Apply saved theme/lang before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('fin.theme'), l = localStorage.getItem('fin.lang')
        if (t) document.documentElement.dataset.theme = t
        if (l) { document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr' }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
