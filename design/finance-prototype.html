/* ============ THEME TOKENS ============ */
:root{
  --font-body:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-display:var(--font-body);
  --font-num:var(--font-body);
  --radius:6px; --gap:16px;
}
[data-theme="ledger"]{
  --bg:#F4EFE3; --bg-image:repeating-linear-gradient(#F4EFE3 0 31px,#e2d9c4 31px 32px);
  --surface:#FBF8F0; --ink:#1F2A24; --muted:#6b6a5c; --line:#d6cbb0;
  --accent:#2E5E3E; --accent-ink:#fff; --pos:#2E5E3E; --neg:#9B2C2C; --warn:#9B2C2C;
  --side-bg:#EBE3D0; --side-ink:#1F2A24; --side-active-bg:#F4EFE3; --side-active-ink:#2E5E3E; --side-edge:3px double #9B2C2C;
  --card-border:1px solid #cfc3a6; --card-shadow:3px 3px 0 #ddd2b9; --row-line:1px dashed #cfc3a6;
  --font-display:'Amiri',serif; --font-num:'Amiri',serif; --radius:2px;
  --tag-bg:transparent; --tag-ink:#9B2C2C; --tag-border:1px solid #9B2C2C;
}
[data-theme="swiss"]{
  --bg:#FFFFFF; --bg-image:none;
  --surface:#FFFFFF; --ink:#111; --muted:#666; --line:#e5e5e5;
  --accent:#E4572E; --accent-ink:#fff; --pos:#111; --neg:#E4572E; --warn:#E4572E;
  --side-bg:#fff; --side-ink:#111; --side-active-bg:#111; --side-active-ink:#fff; --side-edge:1px solid #111;
  --card-border:0; --card-top:2px solid #111; --card-shadow:none; --row-line:1px solid #e5e5e5;
  --radius:0;
  --tag-bg:#E4572E; --tag-ink:#fff; --tag-border:0;
}
[data-theme="geo"]{
  --bg:#EFE6D8; --bg-image:radial-gradient(circle at 20px 20px,transparent 9px,rgba(30,58,95,.07) 10px,transparent 11px); --bg-size:40px 40px;
  --surface:#F8F2E8; --ink:#1E3A5F; --muted:#6a7489; --line:#e0d2bb;
  --accent:#C0623B; --accent-ink:#fff; --pos:#1E3A5F; --neg:#C0623B; --warn:#C0623B;
  --side-bg:#1E3A5F; --side-ink:#EFE6D8; --side-active-bg:#C0623B; --side-active-ink:#fff; --side-edge:0;
  --side-pattern:linear-gradient(45deg,rgba(255,255,255,.05) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.05) 75%),linear-gradient(45deg,rgba(255,255,255,.05) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.05) 75%);
  --card-border:1px solid #d8c7aa; --card-shadow:none; --row-line:1px solid #e3d6c1;
  --font-display:'Reem Kufi',sans-serif; --radius:20px 4px 20px 4px;
  --tag-bg:#C0623B; --tag-ink:#fff; --tag-border:0; --logo:#E8B87A;
}
[data-theme="vault"]{
  --bg:#1C1B19; --bg-image:none;
  --surface:#2A2825; --ink:#E8E2D6; --muted:#9e9686; --line:#3a352d;
  --accent:#B08D57; --accent-ink:#1C1B19; --pos:#B08D57; --neg:#c0634f; --warn:#B08D57;
  --side-bg:#151412; --side-ink:#9e9686; --side-active-bg:transparent; --side-active-ink:#B08D57; --side-edge:1px solid #3a352d;
  --card-border:1px solid #3a352d; --card-shadow:none; --row-line:1px solid #3a352d; --card-inset:1px dashed #3a352d;
  --font-num:'IBM Plex Mono','IBM Plex Sans Arabic',monospace; --radius:2px;
  --tag-bg:transparent; --tag-ink:#B08D57; --tag-border:1px solid #B08D57; --logo:#B08D57;
  color-scheme:dark;
}

/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-body);color:var(--ink);background:var(--bg);background-image:var(--bg-image);background-size:var(--bg-size,auto);-webkit-font-smoothing:antialiased;touch-action:pan-x pan-y}
button,select{font:inherit;color:inherit}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* ============ APP SHELL (no scroll anywhere) ============ */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:220px minmax(0,1fr);overflow:hidden}
.side{background:var(--side-bg);background-image:var(--side-pattern,none);background-size:24px 24px;color:var(--side-ink);border-inline-end:var(--side-edge);padding:24px 14px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.logo{font-family:var(--font-display);font-weight:700;font-size:26px;padding:0 10px 20px;color:var(--logo,inherit);white-space:nowrap}
[data-theme="vault"] .logo{font-family:'IBM Plex Mono';letter-spacing:2px;font-size:20px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:14px;border-radius:var(--radius);white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav button.on{background:var(--side-active-bg);color:var(--side-active-ink)}
[data-theme="vault"] .nav button.on{outline:1px solid var(--accent)}
[data-theme="ledger"] .nav button.on{border-inline-start:3px solid var(--accent)}
.nav button:focus-visible{outline:2px solid var(--accent)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:20px 28px;gap:16px;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.top h1{font-family:var(--font-display);font-size:24px;font-weight:700}
.ctrls{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 10px;font-size:12px;line-height:1}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.swatches{display:flex;gap:6px}
.swatches button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.swatches button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.view{flex:1;min-height:0;position:relative;overflow:hidden}

/* ============ CARDS ============ */
.card{background:var(--surface);border:var(--card-border);border-top:var(--card-top,var(--card-border));box-shadow:var(--card-shadow);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;position:relative}
.card::before{content:"";position:absolute;inset:6px;border:var(--card-inset,0);pointer-events:none;border-radius:inherit}
[data-theme="swiss"] .card{padding:12px 0 0}
.card h3{font-family:var(--font-display);font-size:15px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;flex:none}
[data-theme="vault"] .card h3{color:var(--accent)}
.card h3 small{font-family:var(--font-body);font-weight:400;font-size:12px;color:var(--muted)}
.fit{flex:1;min-height:0;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:var(--row-line);font-size:14px}
.li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li b{font-weight:600}
.more{all:unset;cursor:pointer;font-size:12px;color:var(--accent);padding-top:8px;flex:none}
.tag{font-size:11px;padding:2px 8px;white-space:nowrap;background:var(--tag-bg);color:var(--tag-ink);border:var(--tag-border);border-radius:var(--radius)}
[data-theme="geo"] .tag{border-radius:10px}
.tag.ok{background:transparent;color:var(--muted);border:1px solid var(--line)}

/* ============ DASHBOARD ============ */
.dash{height:100%;display:grid;gap:var(--gap);grid-template-columns:1.2fr 1fr 1fr;grid-template-rows:auto minmax(0,1fr)}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:var(--gap)}
.kpi .lbl{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--font-num);font-size:clamp(20px,2.2vw,30px);font-weight:700;line-height:1.3;white-space:nowrap}
.kpi.hero .v{font-family:var(--font-display);font-size:clamp(30px,3.6vw,52px)}
[data-theme="vault"] .kpi.hero .v{font-family:var(--font-num);font-weight:500}
[data-theme="swiss"] .kpi.hero .v{font-size:clamp(36px,4.4vw,68px);letter-spacing:-2px}
.kpi .d{font-size:12px;margin-top:2px}
.chart{flex:1;min-height:0;display:flex;align-items:flex-end;gap:8px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;background:var(--pos);border-radius:var(--bar-r,0)}
[data-theme="geo"] .chart .bar{border-radius:8px 8px 0 0}
[data-theme="vault"] .chart .bar{background:var(--accent)}
.chart .bar.hi{background:var(--neg)}
.chart .m{font-size:11px;color:var(--muted)}

/* ============ LIST (table ⇄ cards) ============ */
.list{height:100%;display:flex;flex-direction:column;gap:12px}
.list-head{display:flex;justify-content:space-between;align-items:center;flex:none;gap:10px}
.list-body{flex:1;min-height:0;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;font-size:12px;color:var(--muted);text-align:start;padding:10px 12px;border-bottom:2px solid var(--line)}
td{padding:11px 12px;border-bottom:var(--row-line);white-space:nowrap}
.tbl{background:var(--surface);border:var(--card-border);border-radius:var(--radius);box-shadow:var(--card-shadow);overflow:hidden}
[data-theme="swiss"] .tbl{border-top:2px solid #111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;align-content:start}
.ic{padding:14px 16px;gap:6px}
.ic .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.ic .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ic .t .tag,.li .tag{flex:none;overflow:visible}
.ic .amt{font-family:var(--font-num);font-size:22px;font-weight:700}
.ic .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;flex:none;font-size:13px}
.pager button{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.pager button:disabled{opacity:.35;cursor:default}
.pager svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
[dir="rtl"] .pager svg{transform:scaleX(-1)}
.dots{display:flex;gap:6px;justify-content:center;flex:none;padding-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:18px;border-radius:4px}
.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;font-size:14px}

/* ============ TABLET: icon rail ============ */
@media (max-width:1100px){
  .app{grid-template-columns:68px minmax(0,1fr)}
  .side{padding:18px 10px}
  .logo{font-size:0;padding:0 0 16px;text-align:center}
  .logo::first-letter{font-size:24px}
  .nav button{justify-content:center;padding:10px}
  .nav button span{display:none}
  .dash{grid-template-columns:1fr 1fr}
  .dash .c-alerts{display:none}
  .kpis{grid-template-columns:1.6fr 1fr 1fr}
  .kpis .kpi:nth-child(4){display:none}
}
/* ============ PHONE: bottom nav + paged panels ============ */
@media (max-width:720px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .side{grid-row:2;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-inline-end:0;border-top:var(--side-edge)}
  [data-theme="swiss"] .side,[data-theme="vault"] .side{border-top:1px solid var(--line)}
  .logo{display:none}
  .nav{flex-direction:row;justify-content:space-around}
  .nav button{flex-direction:column;gap:3px;padding:6px 4px;font-size:10px;flex:1}
  .nav button span{display:block}
  .nav button.x{display:none}
  .nav button.mob{display:flex}
  .main{padding:14px 14px 8px;gap:10px}
  .top h1{font-size:20px}
  .swatches button{width:20px;height:20px}
  .dash{display:block;position:relative}
  .dash > .panel{position:absolute;inset:0 0 24px 0;display:none}
  .dash > .panel.on{display:flex}
  .kpis{grid-template-columns:1fr;grid-template-rows:1.4fr 1fr 1fr 1fr;gap:10px}
  .kpis .kpi{justify-content:center}
  .kpis .kpi.hero .v{font-size:40px}
  .kpis .kpi:nth-child(4){display:flex}
  .dash .c-alerts{display:flex}
  .dash .dots{position:absolute;bottom:0;inset-inline:0}
  .dash > .panel > *{flex:1}
  .top .ttl-sub{display:none}
}
@media (min-width:721px){ .nav button.mob{display:none} .dash .dots{display:none} .dash > .panel{display:contents} .dash > .panel > .card,.dash > .panel > .kpis{} }
@media (max-height:520px) and (min-width:721px){ .main{padding:12px 20px;gap:10px} .nav button{padding:5px 12px} }

/* sheet for "more" on phone */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:5}
.sheet.on{display:flex}
.sheet .in{background:var(--surface);color:var(--ink);width:100%;padding:16px 16px calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-radius:16px 16px 0 0}
.sheet button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;font-size:12px;border:1px solid var(--line);border-radius:var(--radius)}
.sheet svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo" id="logo"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <header class="top">
      <h1 id="ttl"></h1>
      <div class="ctrls">
        <div class="swatches" id="themes"></div>
        <div class="seg" id="lang"><button data-l="ar">ع</button><button data-l="en">EN</button></div>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

<script>
/* ---------- icons ---------- */
const I={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 acc:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>',
 debt:'<path d="M7 7h11l-3-3M17 17H6l3 3"/>',
 bill:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 sub:'<path d="M4 12a8 8 0 0 1 14-5l2-2v6h-6l2-2a5 5 0 1 0 1 6"/>',
 inv:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
 asset:'<path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/>',
 exp:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.2 1.3-2 3-2s3 .8 3 2-1.3 1.7-3 2-3 .8-3 2 1.3 2 3 2 3-.8 3-2"/>',
 rep:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
 heir:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
 more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',
 next:'<path d="M9 6l6 6-6 6"/>', prev:'<path d="M15 6l-6 6 6 6"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24">${I[k]}</svg>`;

/* ---------- i18n ---------- */
const T={
 ar:{app:'خزينتي',home:'الرئيسية',acc:'الحسابات',debt:'الديون',bill:'الفواتير',sub:'الاشتراكات',inv:'الاستثمارات',asset:'الممتلكات',exp:'المصروفات',rep:'التقارير',heir:'الوريث',more:'المزيد',
  worth:'صافي الثروة',cash:'السيولة',owed:'ديون لك',owe:'ديون عليك',vsLast:'عن الشهر الماضي',balances:'الأرصدة',spend:'المصروفات الشهرية',alerts:'تنبيهات قريبة',seeAll:'عرض الكل',plus:'و{n} أخرى',
  in:'بعد {n} يوم',paid:'مدفوع',name:'الاسم',type:'النوع',provider:'الجهة',balance:'الرصيد',updated:'آخر تحديث',amount:'المبلغ',due:'الاستحقاق',renew:'التجديد',status:'الحالة',cat:'الفئة',
  page:'{a} من {b}',tableV:'جدول',cardV:'بطاقات',soon:'هذه الصفحة في النسخة الكاملة',cur:'ج.م',
  themes:{ledger:'دفتر',swiss:'سويسري',geo:'هندسي',vault:'خزنة'},
  months:['مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر']},
 en:{app:'Treasury',home:'Home',acc:'Accounts',debt:'Debts',bill:'Bills',sub:'Subscriptions',inv:'Investments',asset:'Assets',exp:'Expenses',rep:'Reports',heir:'Heir',more:'More',
  worth:'Net worth',cash:'Liquid cash',owed:'Owed to you',owe:'You owe',vsLast:'vs last month',balances:'Balances',spend:'Monthly spending',alerts:'Upcoming',seeAll:'See all',plus:'+{n} more',
  in:'in {n} days',paid:'Paid',name:'Name',type:'Type',provider:'Provider',balance:'Balance',updated:'Updated',amount:'Amount',due:'Due',renew:'Renews',status:'Status',cat:'Category',
  page:'{a} of {b}',tableV:'Table',cardV:'Cards',soon:'This page comes in the full build',cur:'EGP',
  themes:{ledger:'Ledger',swiss:'Swiss',geo:'Geometric',vault:'Vault'},
  months:['May','Jun','Jul','Aug','Sep','Oct']}
};
let L='ar', theme='ledger', route='home', listMode='table', page=0, dashPanel=0;
try{ L=localStorage.getItem('fin.lang')||L; theme=localStorage.getItem('fin.theme')||theme; listMode=localStorage.getItem('fin.list')||listMode }catch(e){}
const t=(k,v={})=>{let s=T[L][k]??k; for(const x in v) s=s.replace('{'+x+'}',fmt(v[x],0)); return s};
const fmt=(n,d=0)=>typeof n==='number'?new Intl.NumberFormat(L==='ar'?'ar-EG':'en-US',{maximumFractionDigits:d}).format(n):n;
const money=n=>`<span class="num ${n<0?'neg':''}">${fmt(n)}</span>`;
const dt=s=>new Intl.DateTimeFormat(L==='ar'?'ar-EG':'en-GB',{day:'numeric',month:'short'}).format(new Date(s));

/* ---------- sample data ---------- */
const N=(ar,en)=>({ar,en});
const ACC=[
 [N('بطاقة البنك الأهلي','NBE Debit'),N('بطاقة خصم','Debit card'),N('البنك الأهلي','NBE'),42300,'2026-10-14'],
 [N('بطاقة CIB الائتمانية','CIB Credit'),N('بطاقة ائتمان','Credit card'),N('CIB','CIB'),-6400,'2026-10-13'],
 [N('إنستاباي','InstaPay'),N('محفظة','Wallet'),N('إنستاباي','InstaPay'),8200,'2026-10-15'],
 [N('فودافون كاش','Vodafone Cash'),N('محفظة','Wallet'),N('فودافون','Vodafone'),2750,'2026-10-12'],
 [N('اتصالات كاش','Etisalat Cash'),N('محفظة','Wallet'),N('اتصالات','e&'),1100,'2026-10-09'],
 [N('أورانج كاش','Orange Cash'),N('محفظة','Wallet'),N('أورانج','Orange'),640,'2026-10-02'],
 [N('كاش البيت','Cash at home'),N('نقدي','Cash'),N('—','—'),3150,'2026-10-15'],
 [N('كاش المحفظة','Wallet cash'),N('نقدي','Cash'),N('—','—'),820,'2026-10-15'],
 [N('بطاقة بنك مصر','Banque Misr Debit'),N('بطاقة خصم','Debit card'),N('بنك مصر','Banque Misr'),15800,'2026-10-11'],
 [N('حساب توفير','Savings account'),N('توفير','Savings'),N('البنك الأهلي','NBE'),120000,'2026-10-01'],
 [N('بطاقة QNB الائتمانية','QNB Credit'),N('بطاقة ائتمان','Credit card'),N('QNB','QNB'),-2150,'2026-10-10'],
 [N('شهادة ادخار','Savings cert.'),N('شهادة','Certificate'),N('بنك مصر','Banque Misr'),200000,'2026-09-30'],
 [N('محفظة الدولار','USD wallet'),N('نقدي','Cash'),N('—','—'),24500,'2026-10-08'],
 [N('كارت ميزة','Meeza card'),N('بطاقة خصم','Debit card'),N('بنك القاهرة','Banque du Caire'),930,'2026-10-06'],
];
const BILL=[
 [N('الكهرباء','Electricity'),N('مرافق','Utilities'),640,2,'2026-11-17',0],
 [N('اشتراك Claude','Claude subscription'),N('عمل','Work'),1000,5,'2026-11-20',0],
 [N('قسط السيارة','Car installment'),N('أقساط','Loans'),7800,9,'2026-11-24',0],
 [N('دين لأحمد','Debt to Ahmed'),N('ديون','Debts'),2000,12,'2026-10-27',0],
 [N('الإنترنت المنزلي','Home internet'),N('مرافق','Utilities'),450,14,'2026-11-29',0],
 [N('سيرفر Hostinger','Hostinger VPS'),N('عمل','Work'),620,18,'2027-10-03',0],
 [N('الغاز','Gas'),N('مرافق','Utilities'),120,21,'2026-12-06',0],
 [N('تأمين السيارة','Car insurance'),N('تأمين','Insurance'),5400,40,'2027-11-24',0],
 [N('المياه','Water'),N('مرافق','Utilities'),90,-3,'2026-11-12',1],
 [N('نتفليكس','Netflix'),N('شخصي','Personal'),240,-6,'2026-11-09',1],
 [N('الجيم','Gym'),N('شخصي','Personal'),900,-10,'2026-11-05',1],
];
const SPEND=[18400,21900,16300,27800,19700,17200];
const today=new Date('2026-10-15');
const dueDate=d=>{const x=new Date(today);x.setDate(x.getDate()+d);return x};

/* ---------- auto-fit helpers (the no-scroll engine) ---------- */
// Fill a box with as many items as fit; overflow becomes "+N more".
function fitList(box,items,render,onMore){
  box.innerHTML='';
  const over=()=>box.scrollHeight>box.clientHeight+1;
  let i=0;
  for(;i<items.length;i++){ box.insertAdjacentHTML('beforeend',render(items[i])); if(over()){box.lastElementChild.remove();break} }
  if(i>=items.length) return;
  const btn=document.createElement('button');btn.className='more';btn.onclick=onMore;box.appendChild(btn);
  const upd=()=>btn.textContent=t('plus',{n:items.length-(box.children.length-1)});
  upd();
  while(over()&&box.children.length>1){btn.previousElementSibling.remove();upd()}
}
// How many rows/cards fit on one page of the list.
function pageSizeFor(body,mode,sampleHTML,headHTML=''){
  body.innerHTML=sampleHTML;
  const H=body.clientHeight;
  if(mode==='table'){
    const thead=body.querySelector('thead'), row=body.querySelector('tbody tr');
    return Math.max(1,Math.floor((H-thead.offsetHeight-2)/row.offsetHeight));
  }
  const grid=body.firstElementChild, card=grid.firstElementChild;
  const cols=getComputedStyle(grid).gridTemplateColumns.split(' ').length;
  const gap=parseFloat(getComputedStyle(grid).rowGap)||0;
  const rows=Math.max(1,Math.floor((H+gap)/(card.offsetHeight+gap)));
  return cols*rows;
}

/* ---------- swipe (pages change, nothing scrolls) ---------- */
let sx=null,sy=null;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(sx===null)return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
  if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy))return;
  const fwd=(L==='ar')?dx>0:dx<0; // RTL: swipe right = next
  if(route==='home'){ const n=document.querySelectorAll('.dash>.panel').length; if(innerWidth<=720){dashPanel=Math.min(n-1,Math.max(0,dashPanel+(fwd?1:-1)));render()} }
  else if(window._pager){ window._pager(fwd?1:-1) }
},{passive:true});
document.addEventListener('touchmove',e=>{ if(!e.target.closest('.allow-scroll')) e.preventDefault() },{passive:false});

/* ---------- views ---------- */
const NAV=['home','acc','debt','bill','sub','inv','asset','exp','rep','heir'];
const MOBILE_NAV=['home','acc','bill','exp'];

function dashboard(v){
  const total=ACC.reduce((s,a)=>s+a[3],0)+186000+14500;
  const cash=ACC.filter(a=>a[3]>0&&['Wallet','Cash','Debit card'].includes(a[1].en)).reduce((s,a)=>s+a[3],0);
  const max=Math.max(...SPEND);
  v.innerHTML=`<div class="dash">
   <div class="panel"><div class="kpis">
     <div class="card kpi hero"><div class="lbl">${t('worth')}</div><div class="v">${fmt(total)} <small style="font-size:.4em">${t('cur')}</small></div><div class="d pos">▲ ${fmt(4.2,1)}٪ ${t('vsLast')}</div></div>
     <div class="card kpi"><div class="lbl">${t('cash')}</div><div class="v">${fmt(cash)}</div></div>
     <div class="card kpi"><div class="lbl">${t('owed')}</div><div class="v pos">${fmt(5500)}</div></div>
     <div class="card kpi"><div class="lbl">${t('owe')}</div><div class="v neg">${fmt(2000)}</div></div>
   </div></div>
   <div class="panel"><div class="card c-bal"><h3>${t('balances')}<small>${fmt(ACC.length)}</small></h3><div class="fit" id="fBal"></div></div></div>
   <div class="panel"><div class="card c-chart"><h3>${t('spend')}</h3><div class="chart">${SPEND.map((x,i)=>`<div class="col"><div class="bar ${x===max?'hi':''}" style="height:${x/max*85}%"></div><div class="m">${T[L].months[i]}</div></div>`).join('')}</div></div></div>
   <div class="panel"><div class="card c-alerts"><h3>${t('alerts')}</h3><div class="fit" id="fAl"></div></div></div>
   <div class="dots">${[0,1,2,3].map(i=>`<i class="${i===dashPanel?'on':''}"></i>`).join('')}</div>
  </div>`;
  const panels=v.querySelectorAll('.dash>.panel'); panels[dashPanel]?.classList.add('on');
  // desktop: second row = 3 cards side by side
  const bal=v.querySelector('#fBal'), al=v.querySelector('#fAl');
  if(bal.clientHeight) fitList(bal,[...ACC].sort((a,b)=>b[3]-a[3]),a=>`<div class="li"><span>${a[0][L]}</span>${money(a[3])}</div>`,()=>go('acc'));
  if(al.clientHeight) fitList(al,BILL.filter(b=>!b[5]),b=>`<div class="li"><span>${b[0][L]}</span><span class="tag">${t('in',{n:b[3]})}</span></div>`,()=>go('bill'));
}

function listView(v,cfg){
  v.innerHTML=`<div class="list">
    <div class="list-head"><div class="seg" id="mode"><button data-m="table">${t('tableV')}</button><button data-m="cards">${t('cardV')}</button></div><span style="font-size:13px;color:var(--muted)">${fmt(cfg.rows.length)}</span></div>
    <div class="list-body" id="lb"></div>
    <div class="pager"><button id="pv" aria-label="prev">${svg('prev')}</button><span id="pi"></span><button id="nx" aria-label="next">${svg('next')}</button></div>
  </div>`;
  const narrow=innerWidth<=720, mode=narrow?'cards':listMode;
  const modeEl=v.querySelector('#mode'); if(narrow) modeEl.style.visibility='hidden';
  modeEl.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.m===mode);b.onclick=()=>{listMode=b.dataset.m;try{localStorage.setItem('fin.list',listMode)}catch(e){};page=0;render()}});
  const body=v.querySelector('#lb');
  const tableHTML=rows=>`<div class="tbl"><table><thead><tr>${cfg.cols.map(c=>`<th>${t(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(cfg.tr).join('')}</tbody></table></div>`;
  const cardsHTML=rows=>`<div class="grid">${rows.map(cfg.card).join('')}</div>`;
  const html=mode==='table'?tableHTML:cardsHTML;
  const size=pageSizeFor(body,mode,html(cfg.rows.slice(0,1)));
  const pages=Math.max(1,Math.ceil(cfg.rows.length/size)); page=Math.min(page,pages-1);
  body.innerHTML=html(cfg.rows.slice(page*size,page*size+size));
  v.querySelector('#pi').textContent=t('page',{a:page+1,b:pages});
  const pv=v.querySelector('#pv'),nx=v.querySelector('#nx');
  pv.disabled=page===0; nx.disabled=page>=pages-1;
  window._pager=d=>{const p=page+d; if(p>=0&&p<pages){page=p;render()}};
  pv.onclick=()=>window._pager(-1); nx.onclick=()=>window._pager(1);
}

const VIEWS={
 home:dashboard,
 acc:v=>listView(v,{rows:ACC,cols:['name','type','provider','balance','updated'],
   tr:a=>`<tr><td>${a[0][L]}</td><td>${a[1][L]}</td><td>${a[2][L]}</td><td>${money(a[3])}</td><td>${dt(a[4])}</td></tr>`,
   card:a=>`<div class="card ic"><div class="t"><span>${a[0][L]}</span><span class="tag ok">${a[1][L]}</span></div><div class="amt ${a[3]<0?'neg':''}">${fmt(a[3])}</div><div class="meta"><span>${a[2][L]}</span><span>${dt(a[4])}</span></div></div>`}),
 bill:v=>listView(v,{rows:BILL,cols:['name','cat','amount','due','renew','status'],
   tr:b=>`<tr><td>${b[0][L]}</td><td>${b[1][L]}</td><td>${money(b[2])}</td><td>${dt(dueDate(b[3]))}</td><td>${dt(b[4])}</td><td>${b[5]?`<span class="tag ok">${t('paid')}</span>`:`<span class="tag">${t('in',{n:b[3]})}</span>`}</td></tr>`,
   card:b=>`<div class="card ic"><div class="t"><span>${b[0][L]}</span>${b[5]?`<span class="tag ok">${t('paid')}</span>`:`<span class="tag">${t('in',{n:b[3]})}</span>`}</div><div class="amt">${fmt(b[2])}</div><div class="meta"><span>${b[1][L]}</span><span>${t('renew')}: ${dt(b[4])}</span></div></div>`}),
};

/* ---------- shell ---------- */
function go(r){route=r;page=0;dashPanel=0;document.getElementById('sheet').classList.remove('on');render()}
function render(){
  const H=document.documentElement; H.lang=L; H.dir=L==='ar'?'rtl':'ltr'; H.dataset.theme=theme;
  document.getElementById('logo').textContent=t('app');
  const navHTML=NAV.map(k=>`<button data-r="${k}" class="${route===k?'on':''} ${MOBILE_NAV.includes(k)?'':'x'}">${svg(k)}<span>${t(k)}</span></button>`).join('')
    +`<button class="mob ${MOBILE_NAV.includes(route)?'':'on'}" data-r="__more">${svg('more')}<span>${t('more')}</span></button>`;
  const nav=document.getElementById('nav'); nav.innerHTML=navHTML;
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>b.dataset.r==='__more'?document.getElementById('sheet').classList.add('on'):go(b.dataset.r));
  document.getElementById('sheetIn').innerHTML=NAV.filter(k=>!MOBILE_NAV.includes(k)).map(k=>`<button data-r="${k}">${svg(k)}<span>${t(k)}</span></button>`).join('');
  document.querySelectorAll('#sheetIn button').forEach(b=>b.onclick=()=>go(b.dataset.r));
  document.getElementById('ttl').textContent=t(route);
  document.getElementById('themes').innerHTML=['ledger','swiss','geo','vault'].map(k=>{
    const c={ledger:['#F4EFE3','#2E5E3E'],swiss:['#fff','#E4572E'],geo:['#1E3A5F','#C0623B'],vault:['#1C1B19','#B08D57']}[k];
    return `<button data-t="${k}" class="${theme===k?'on':''}" title="${T[L].themes[k]}" aria-label="${T[L].themes[k]}" style="background:linear-gradient(135deg,${c[0]} 50%,${c[1]} 50%)"></button>`}).join('');
  document.querySelectorAll('#themes button').forEach(b=>b.onclick=()=>{theme=b.dataset.t;try{localStorage.setItem('fin.theme',theme)}catch(e){};render()});
  document.querySelectorAll('#lang button').forEach(b=>{b.classList.toggle('on',b.dataset.l===L);b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('fin.lang',L)}catch(e){};render()}});
  window._pager=null;
  const v=document.getElementById('view');
  (VIEWS[route]||(v=>v.innerHTML=`<div class="empty">${svg(route).replace('<svg','<svg style="width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.4;margin-bottom:10px"')}<br>${t('soon')}</div>`))(v);
}
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.classList.remove('on')};
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,120)});
document.fonts.ready.then(render); render();
</script>
</body>
