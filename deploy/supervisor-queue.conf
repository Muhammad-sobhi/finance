; /etc/supervisor/conf.d/finance-queue.conf — sends queued emails and web pushes.
[program:finance-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/finance/backend/artisan queue:work --sleep=3 --tries=3 --backoff=30 --max-time=3600
directory=/var/www/finance/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
; Keep retrying while MySQL restarts (e.g. an unattended upgrade) instead of going FATAL after 3 tries.
; Supervisor waits 1s, 2s, 3s… between tries, so 100 tries cover well over an hour.
startretries=100
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/finance/backend/storage/logs/queue.log
