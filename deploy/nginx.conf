# /etc/nginx/sites-available/finance  — replace finance.example.com and paths.
# One origin serves the SPA (frontend/dist) and the API (/api, /up) via PHP-FPM.

server {
    listen 80;
    listen [::]:80;
    server_name finance.example.com;
    # certbot adds the HTTPS redirect here; push notifications and service workers need HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finance.example.com;

    # Managed by certbot (sudo certbot --nginx -d finance.example.com)
    ssl_certificate     /etc/letsencrypt/live/finance.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finance.example.com/privkey.pem;

    root /var/www/finance/frontend/dist;
    index index.html;
    client_max_body_size 8m; # receipts (≤ 5 MB) + JSON imports
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Only our own code may run; no inline scripts, no third-party hosts, no framing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Laravel API: every /api/* and the /up health check go to backend/public/index.php.
    location ~ ^/(api|up)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/finance/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/finance/backend/public;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # Caching uses `expires`, not add_header: a location with its own add_header would
    # silently drop the security headers above (nginx doesn't merge add_header).

    # The service worker must always be re-checked so updates reach installed clients.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    # Hashed build assets (JS, CSS, fonts) can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA routes (/, /transactions, /link?..., /heir-request ...) → index.html (never cached).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) { deny all; }
}
